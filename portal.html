<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ASHIK CYBER CAFE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f172a;color:#fff;padding:10px}
.card{background:#1e293b;padding:20px;border-radius:16px;max-width:900px;margin:15px auto;border:1px solid #334155}
h2{text-align:center;color:#38bdf8}
input{width:100%;padding:12px;margin:6px 0;border-radius:8px;background:#0f172a;color:#fff;border:1px solid #334155}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:8px}
.b1{background:#38bdf8;color:#000}.b2{background:#22c55e;color:#000}.b3{background:#475569;color:#fff}
.wallet{background:linear-gradient(135deg,#0ea5e9,#22c55e);color:#000;padding:18px;border-radius:14px;text-align:center;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scard{background:#0f172a;border:1px solid #334155;padding:12px;border-radius:12px;cursor:pointer;text-align:center}
.scard b{color:#38bdf8}.price{color:#facc15;font-weight:bold}
.ret-box{background:#0f172a;padding:10px;border-radius:10px;margin:6px 0;border-left:4px solid #22c55e}
.info{background:#0f172a;padding:10px;border-radius:10px;margin:6px 0;border:1px solid #334155;font-size:13px}
</style>
</head>
<body>

<div id="loginPage" class="card">
<h2>ASHIK CYBER CAFE</h2>
<input id="lu" placeholder="Username"><input id="lp" type="password" placeholder="Password">
<button class="btn b1" onclick="login()">Login</button>
<button class="btn b3" onclick="showReg()">New Register</button>
</div>

<div id="regPage" class="card" style="display:none">
<h2>Retailer Registration</h2>
<input id="ru" placeholder="Username"><input id="rp" type="password" placeholder="Password"><input id="rm" placeholder="Mobile"><input id="rn" placeholder="Name">
<button class="btn b2" onclick="register()">Register</button>
<button class="btn b3" onclick="showLogin()">Back</button>
</div>

<div id="retPage" class="card" style="display:none">
<h2>Retailer Panel</h2>
<div class="wallet"><p>💼 MY WALLET</p><h1 id="wBal">₹0</h1><p id="wMob"></p><p id="wUser"></p></div>
<div class="grid">
<div class="scard" onclick="selectService('Aadhar Mobile Link',180)"><b>Aadhar Mobile Link</b><br><span class="price">₹180</span></div>
<div class="scard" onclick="selectService('Trade License',500)"><b>Trade License</b><br><span class="price">₹500</span></div>
<div class="scard" onclick="selectService('Udyam Certificate',300)"><b>Udyam</b><br><span class="price">₹300</span></div>
<div class="scard" onclick="selectService('PAN Card',250)"><b>PAN Card</b><br><span class="price">₹250</span></div>
<div class="scard" onclick="selectService('Income Certificate',300)"><b>Income</b><br><span class="price">₹300</span></div>
<div class="scard" onclick="selectService('Voter Card',150)"><b>Voter Card</b><br><span class="price">₹150</span></div>
</div>
<div id="applyBox" style="display:none;background:#0f172a;padding:15px;border-radius:12px;margin-top:15px;border:2px solid #38bdf8">
<h3 id="selServiceName"></h3><p id="selPrice" class="price"></p>
<input id="cName" placeholder="Customer Name"><input id="cAadhar" placeholder="Aadhar"><input id="cMob" placeholder="Customer Mobile">
<button class="btn b1" onclick="applyService()">Confirm Apply</button><p id="retMsg" style="color:#22c55e"></p>
</div>
