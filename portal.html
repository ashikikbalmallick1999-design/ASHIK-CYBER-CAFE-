<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ASHIK CYBER CAFE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f172a;color:#fff;padding:10px}
.card{background:#1e293b;padding:20px;border-radius:16px;max-width:900px;margin:15px auto;border:1px solid #334155}
h2{text-align:center;color:#38bdf8}
input{width:100%;padding:12px;margin:6px 0;border-radius:8px;background:#0f172a;color:#fff;border:1px solid #334155}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:8px}
.b1{background:#38bdf8;color:#000}.b2{background:#22c55e;color:#000}.b3{background:#475569;color:#fff}
.wallet{background:linear-gradient(135deg,#0ea5e9,#22c55e);color:#000;padding:18px;border-radius:14px;text-align:center;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scard{background:#0f172a;border:1px solid #334155;padding:12px;border-radius:12px;cursor:pointer;text-align:center}
.scard b{color:#38bdf8}.price{color:#facc15;font-weight:bold}
</style>
</head>
<body>

<div id="loginPage" class="card">
<h2>ASHIK CYBER CAFE</h2>
<input id="lu" placeholder="Username">
<input id="lp" type="password" placeholder="Password">
<button class="btn b1" onclick="login()">Login</button>
<button class="btn b3" onclick="showReg()">New Retailer Register</button>
<p style="font-size:11px;color:#64748b;margin-top:10px;text-align:center">Admin: ashi2248 / Ashik@2026 (hidden for retailer)</p>
</div>

<div id="regPage" class="card" style="display:none">
<h2>New Registration</h2>
<input id="ru" placeholder="Username">
<input id="rp" type="password" placeholder="Password">
<input id="rm" placeholder="Mobile Number">
<button class="btn b2" onclick="register()">Register Now</button>
<button class="btn b3" onclick="showLogin()">Back to Login</button>
</div>

<div id="retPage" class="card" style="display:none">
<h2>Retailer Panel</h2>
<div class="wallet"><h1 id="wBal">₹0</h1><p id="wUser"></p></div>
<div class="grid">
<div class="scard" onclick="applyDirect('Aadhar Mobile Link',180)"><b>Aadhar Link</b><br><span class="price">₹180</span></div>
<div class="scard" onclick="applyDirect('PAN Card',250)"><b>PAN Card</b><br><span class="price">₹250</span></div>
<div class="scard" onclick="applyDirect('Voter Card',150)"><b>Voter Card</b><br><span class="price">₹150</span></div>
<div class="scard" onclick="applyDirect('Trade License',500)"><b>Trade License</b><br><span class="price">₹500</span></div>
</div>
<p id="retMsg" style="color:#22c55e;margin-top:10px"></p>
<button class="btn" style="background:#ef4444;color:#fff;margin-top:20px" onclick="logout()">Logout</button>
<button class="btn b3" onclick="localStorage.clear();alert('Cleared!');location.reload()">Clear Data (if bug)</button>
</div>

<div id="adminPage" class="card" style="display:none">
<h2>👑 ADMIN PANEL</h2>
<div style="background:#334155;padding:12px;border-radius:10px">
<b>Add Wallet Money</b>
<input id="aUser" placeholder="Retailer Username">
<input id="aAmt" type="number" placeholder="Amount 500">
<button class="btn b2" onclick="adminAddWallet()">Add Money</button>
<p id="adminMsg"></p>
</div>
<div id="retList" style="margin-top:15px"></div>
<button class="btn" style="background:#ef4444;color:#fff" onclick="logout()">Logout</button>
</div>

<script>
let users = JSON.parse(localStorage.getItem('ashik_final_db') || '[]');
let cur=null;
function save(){localStorage.setItem('ashik_final_db', JSON.stringify(users));}
function showReg(){loginPage.style.display='none';regPage.style.display='block';}
function showLogin(){regPage.style.display='none';retPage.style.display='none';adminPage.style.display='none';loginPage.style.display='block';}
function register(){
 let u=ru.value.trim(), p=rp.value.trim(), m=rm.value.trim();
 if(!u||!p||!m){alert('Sob fill koro bhai');return;}
 if(users.find(x=>x.u==u)){alert('Ei username age ache');return;}
 users.push({u:u,p:p,m:m,b:0});
 save();
 alert('Registration Success! Ebar login koro');
 showLogin();
}
function login(){
 let u=lu.value.trim(), p=lp.value.trim();
 // ADMIN CHECK - DIRECT
 if(u==='ashi2248' && p==='Ashik@2026'){
   loginPage.style.display='none';
   adminPage.style.display='block';
   renderAdmin();
   return;
 }
 let f=users.find(x=>x.u===u && x.p===p);
 if(!f){alert('Wrong ID Pass bhai! Age register koro');return;}
 cur=f;
 loginPage.style.display='none';
 retPage.style.display='block';
 wBal.innerText='₹'+cur.b;
 wUser.innerText='User: '+cur.u+' | Mob: '+cur.m;
}
function applyDirect(name,price){
 if(cur.b < price){alert('Balance kom! Ache ₹'+cur.b+' Lagbe ₹'+price);return;}
 cur.b -= price;
 save();
 wBal.innerText='₹'+cur.b;
 retMsg.innerText='✅ '+name+' Apply Success! ₹'+price+' katlo';
}
function renderAdmin(){
 let html='';
 users.forEach(u=>{
  html+=`<div style="background:#0f172a;padding:10px;margin:5px 0;border-radius:8px;border-left:4px solid #22c55e"><b>${u.u}</b> - ${u.m} - Wallet: ₹${u.b}</div>`;
 });
 retList.innerHTML=html || 'Kono retailer nei';
}
function adminAddWallet(){
 let u=aUser.value.trim(), a=parseInt(aAmt.value);
 let f=users.find(x=>x.u===u);
 if(!f){adminMsg.innerText='User pai ni';return;}
 if(!a){alert('Amount dao');return;}
 f.b+=a;
 save();
 renderAdmin();
 adminMsg.innerText='✅ ₹'+a+' add holo '+u+' ke';
}
function logout(){location.reload();}
</script>
</body>
</html>
